# 省略 --relations 时，按此处顺序查询全部关系。
# PyYAML 会把未加引号的 on/off/yes/no 解析为布尔值，关系名称需加引号。
relations:
  left_of: 主体的框中心在客体框中心左侧，按画面坐标判断
  right_of: 主体的框中心在客体框中心右侧，按画面坐标判断
  "on": 主体放在客体表面并由客体支撑，仅仅处于上方不算
  holding: 主体通过手部抓握或托持客体，仅靠近不算

prompt:
  task: |
    你正在进行机器人场景关系判断。第一张是原图，第二张是同一画面的编号图。
    编号图只用于定位对象，结合原图判断关系。
  guidelines: |
    对象名称可能有检测错误；如果无法对应到实际物体，请返回 unknown。
    只有画面证据明确时才返回 yes 或 no；遮挡、无法确认身份或证据不足时返回 unknown。
    不能仅凭类别常识判断。
    reason 用一句简短中文描述可见证据，不推测未观察到的动作。
